<!-- "Left for the Reader": a written argument that stops partway through
     the last line, and the QED box left open where the rest should be. -->
<svg class="lftr-hero-svg" viewBox="0 0 560 250" role="img"
     aria-label="Lines of writing on a page. The last line stops short, and an empty dashed square sits where the end of the proof should be.">

  <!-- the part that got written -->
  <g fill="var(--chalk-faint)">
    <rect x="40" y="36"  width="480" height="9" rx="4.5"/>
    <rect x="40" y="76"  width="480" height="9" rx="4.5"/>
    <rect x="40" y="116" width="452" height="9" rx="4.5"/>
    <rect x="40" y="156" width="480" height="9" rx="4.5"/>
  </g>

  <!-- the last line, trailing off -->
  <rect x="40" y="196" width="132" height="9" rx="4.5" fill="var(--ochre)" opacity=".9"/>

  <!-- and the box, left open -->
  <rect class="lftr-box" x="204" y="180" width="41" height="41" rx="3"
        fill="none" stroke="var(--ochre)" stroke-width="2.4"
        stroke-dasharray="6 8" opacity=".85"/>
</svg>
